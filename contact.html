<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Zaid Threads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html"><img src="logo.png" alt="Zaid Threads Logo" class="logo-img"></a></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-container" style="padding: 100px 10%;">
        <h1>Contact Zaid Threads</h1>
        <p>Have questions about our premium streetwear? Send us a message!</p>
        
        <form action="https://formspree.io/f/xreldajn" method="POST" id="contact-form">
            <div style="margin-bottom: 15px;">
                <label>Your Name:</label><br>
                <input type="text" name="name" required style="width: 100%; padding: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Your Email:</label><br>
                <input type="email" name="email" required style="width: 100%; padding: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Message:</label><br>
                <textarea name="message" required style="width: 100%; height: 150px; padding: 10px;"></textarea>
            </div>
            <button type="submit" class="filter-btn active">Send Message</button>
        </form>
    </section>
</body>
</html>
